server:
  port: 8080

pokedex:
  frontend-url: http://localhost:5173
  poke-api:
    base-url: https://pokeapi.co/api/v2
    connect-timeout: 5s
    read-timeout: 5s
    retries: 2
    retry-initial-delay: 200ms
  page:
    default-size: 5
    max-size: 10
  cache:
    ttl: 1h

spring:
  application:
    name: pokedex-backend